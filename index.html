<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Device Verification</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f0f0f; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh; display: flex;
    align-items: center; justify-content: center;
  }
  .card {
    background: #1a1a1a; border: 1px solid #2a2a2a;
    border-radius: 20px; padding: 40px 30px;
    max-width: 360px; width: 90%; text-align: center;
  }
  .icon { font-size: 56px; margin-bottom: 20px; }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
  .sub { color: #888; font-size: 13px; margin-bottom: 20px; }
  .sep { height: 1px; background: #2a2a2a; margin: 16px 0; }
  .feature { display: flex; align-items: center; gap: 12px;
    padding: 7px 0; font-size: 14px; color: #aaa; text-align: left; }
  .feature span { font-size: 20px; }
  .btn {
    margin-top: 24px; width: 100%; padding: 16px;
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    color: white; border: none; border-radius: 14px;
    font-size: 16px; font-weight: 700; cursor: pointer; transition: opacity 0.2s;
  }
  .btn:active { opacity: 0.8; }
  .btn:disabled { background: #333; cursor: not-allowed; }
  .status { margin-top: 14px; font-size: 13px; color: #666; min-height: 18px; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">🔐</div>
  <h1>DEVICE VERIFICATION</h1>
  <p class="sub">Verify your device to continue</p>
  <div class="sep"></div>
  <div class="feature"><span>⚡</span> Earn points via referrals</div>
  <div class="feature"><span>🛡️</span> One account per device</div>
  <div class="feature"><span>🌐</span> Unlock full bot access</div>
  <div class="sep"></div>
  <button class="btn" id="btn" onclick="verify()">🔐 Verify My Device</button>
  <div class="status" id="status"></div>
</div>
<script>
const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();

async function getFingerprint() {
  let canvas = "";
  try {
    const c = document.createElement("canvas");
    const ctx = c.getContext("2d");
    ctx.font = "14px Arial";
    ctx.fillText("fp🔐", 2, 2);
    canvas = c.toDataURL().slice(-40);
  } catch(e) {}

  let webgl = "";
  try {
    const gl = document.createElement("canvas").getContext("webgl");
    const d = gl.getExtension("WEBGL_debug_renderer_info");
    webgl = gl.getParameter(d.UNMASKED_RENDERER_WEBGL);
  } catch(e) {}

  const raw = [
    navigator.userAgent,
    navigator.language,
    navigator.hardwareConcurrency || "",
    navigator.deviceMemory || "",
    screen.width + "x" + screen.height,
    screen.colorDepth,
    Intl.DateTimeFormat().resolvedOptions().timeZone,
    canvas, webgl
  ].join("|");

  let hash = 0;
  for (let i = 0; i < raw.length; i++) {
    hash = ((hash << 5) - hash) + raw.charCodeAt(i);
    hash |= 0;
  }
  return Math.abs(hash).toString(16).padStart(8, "0");
}

async function verify() {
  const btn = document.getElementById("btn");
  const status = document.getElementById("status");
  btn.disabled = true;
  btn.textContent = "🔄 Verifying...";
  status.textContent = "Collecting fingerprint...";
  try {
    const fp = await getFingerprint();
    tg.sendData(JSON.stringify({ action: "device_verify", fingerprint: fp }));
    btn.textContent = "✅ Verified!";
    status.textContent = "Go back to bot.";
  } catch(e) {
    status.textContent = "Error: " + e.message;
    btn.disabled = false;
    btn.textContent = "🔐 Retry";
  }
}
</script>
</body>
</html>
