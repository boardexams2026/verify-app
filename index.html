<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Device Verification</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* ── TOKENS ────────────────────────────────────────────────── */
    :root {
      --bg:         #0d0f14;
      --surface:    #161b25;
      --border:     #232a38;
      --accent:     #4f8ef7;
      --accent-dim: #2a4a8a;
      --ok:         #2ecc71;
      --fail:       #e74c3c;
      --warn:       #f39c12;
      --text:       #e8eaf0;
      --muted:      #6b7591;
      --radius:     14px;
      --font:       -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    }

    /* ── RESET ─────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ── LAYOUT ────────────────────────────────────────────────── */
    .shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px 40px;
      gap: 0;
    }

    /* ── SHIELD ICON ───────────────────────────────────────────── */
    .shield-wrap {
      position: relative;
      width: 88px;
      height: 88px;
      margin-bottom: 24px;
    }

    .shield-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid var(--border);
    }

    .shield-ring.pulse {
      animation: ring-pulse 2s ease-in-out infinite;
    }

    @keyframes ring-pulse {
      0%, 100% { transform: scale(1);   opacity: .4; }
      50%       { transform: scale(1.18); opacity: .08; }
    }

    .shield-icon {
      width: 88px;
      height: 88px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: var(--surface);
      border: 2px solid var(--border);
      position: relative;
      z-index: 1;
      transition: border-color .4s, box-shadow .4s;
    }

    .shield-icon svg {
      width: 40px;
      height: 40px;
      transition: opacity .3s;
    }

    .shield-icon.ok    { border-color: var(--ok);   box-shadow: 0 0 24px rgba(46,204,113,.25); }
    .shield-icon.fail  { border-color: var(--fail);  box-shadow: 0 0 24px rgba(231,76,60,.25);  }
    .shield-icon.scanning { border-color: var(--accent); box-shadow: 0 0 24px rgba(79,142,247,.2); }

    /* ── SPINNER ───────────────────────────────────────────────── */
    .spinner-ring {
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 2.5px solid transparent;
      border-top-color: var(--accent);
      animation: spin 1s linear infinite;
      display: none;
    }

    .shield-icon.scanning .spinner-ring { display: block; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── HEADLINE ──────────────────────────────────────────────── */
    .headline {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -.4px;
      text-align: center;
      margin-bottom: 8px;
      transition: color .3s;
    }

    .sub {
      font-size: 14px;
      color: var(--muted);
      text-align: center;
      max-width: 280px;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    /* ── PROGRESS STEPS ────────────────────────────────────────── */
    .steps {
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 28px;
    }

    .step {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      transition: border-color .3s, background .3s;
    }

    .step.active  { border-color: var(--accent);  background: rgba(79,142,247,.06); }
    .step.done    { border-color: var(--ok);      background: rgba(46,204,113,.05); }
    .step.failed  { border-color: var(--fail);    background: rgba(231,76,60,.06);  }

    .step-dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: border-color .3s, background .3s;
      font-size: 11px;
      font-weight: 700;
    }

    .step.active  .step-dot { border-color: var(--accent);  background: var(--accent-dim); color: #fff; }
    .step.done    .step-dot { border-color: var(--ok);      background: var(--ok);          color: #fff; }
    .step.failed  .step-dot { border-color: var(--fail);    background: var(--fail);         color: #fff; }

    .step-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      transition: color .3s;
    }

    .step.active .step-label { color: var(--text); }
    .step.done   .step-label { color: var(--ok);   }
    .step.failed .step-label { color: var(--fail);  }

    .step-check {
      margin-left: auto;
      font-size: 14px;
      opacity: 0;
      transition: opacity .3s;
    }

    .step.done   .step-check { opacity: 1; }
    .step.failed .step-check { opacity: 1; color: var(--fail); }

    /* ── MINI DOT SPINNER inside active step ───────────────────── */
    .step-spinner {
      margin-left: auto;
      width: 14px;
      height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: none;
    }

    .step.active .step-spinner { display: block; }
    .step.done   .step-spinner,
    .step.failed .step-spinner { display: none; }

    /* ── STATUS BAR ────────────────────────────────────────────── */
    .status-bar {
      width: 100%;
      max-width: 320px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: border-color .3s, color .3s;
      margin-bottom: 20px;
    }

    .status-bar.ok   { border-color: var(--ok);  color: var(--ok);  }
    .status-bar.fail { border-color: var(--fail); color: var(--fail); }

    /* ── BUTTON ────────────────────────────────────────────────── */
    .btn {
      width: 100%;
      max-width: 320px;
      padding: 15px 24px;
      border-radius: var(--radius);
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: .1px;
      transition: opacity .2s, transform .1s;
      display: none;
    }

    .btn:active { transform: scale(.98); }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-danger {
      background: var(--fail);
      color: #fff;
    }

    .btn.visible { display: block; }

    /* ── DEVICE ID BOX ─────────────────────────────────────────── */
    .devid-box {
      width: 100%;
      max-width: 320px;
      padding: 10px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 11px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      color: var(--muted);
      word-break: break-all;
      text-align: center;
      display: none;
      margin-bottom: 12px;
    }

    .devid-box.visible { display: block; }

    /* ── FOOTER ────────────────────────────────────────────────── */
    .footer {
      margin-top: 24px;
      font-size: 11px;
      color: var(--muted);
      opacity: .5;
      text-align: center;
    }
  </style>
</head>
<body>
<div class="shell">

  <!-- shield -->
  <div class="shield-wrap">
    <div class="shield-ring pulse"></div>
    <div class="shield-icon scanning" id="shieldIcon">
      <div class="spinner-ring"></div>
      <svg id="shieldSvg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
    </div>
  </div>

  <h1 class="headline" id="headline">Verifying Device</h1>
  <p class="sub" id="subline">Collecting device signals — this takes just a second.</p>

  <!-- steps -->
  <div class="steps">
    <div class="step active" id="step1">
      <div class="step-dot">1</div>
      <span class="step-label">Collecting device signals</span>
      <div class="step-spinner"></div>
      <span class="step-check">✓</span>
    </div>
    <div class="step" id="step2">
      <div class="step-dot">2</div>
      <span class="step-label">Generating fingerprint</span>
      <div class="step-spinner"></div>
      <span class="step-check">✓</span>
    </div>
    <div class="step" id="step3">
      <div class="step-dot">3</div>
      <span class="step-label">Checking device registry</span>
      <div class="step-spinner"></div>
      <span class="step-check">✓</span>
    </div>
    <div class="step" id="step4">
      <div class="step-dot">4</div>
      <span class="step-label">Completing verification</span>
      <div class="step-spinner"></div>
      <span class="step-check">✓</span>
    </div>
  </div>

  <!-- status -->
  <div class="status-bar" id="statusBar">Initialising…</div>

  <!-- device id display -->
  <div class="devid-box" id="devidBox"></div>

  <!-- action button (shown only on error) -->
  <button class="btn btn-primary" id="retryBtn" onclick="startVerification()">Try Again</button>
  <button class="btn btn-danger"  id="supportBtn" onclick="openSupport()">Contact Support</button>

  <p class="footer">1 device · 1 account · always secure</p>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   TELEGRAM WEB APP INIT
═══════════════════════════════════════════════════════════════ */
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

/* ═══════════════════════════════════════════════════════════════
   DOM REFS
═══════════════════════════════════════════════════════════════ */
const shieldIcon  = document.getElementById('shieldIcon');
const headline    = document.getElementById('headline');
const subline     = document.getElementById('subline');
const statusBar   = document.getElementById('statusBar');
const devidBox    = document.getElementById('devidBox');
const retryBtn    = document.getElementById('retryBtn');
const supportBtn  = document.getElementById('supportBtn');
const steps       = [1,2,3,4].map(i => document.getElementById('step' + i));

/* ═══════════════════════════════════════════════════════════════
   STEP HELPERS
═══════════════════════════════════════════════════════════════ */
function setStep(idx, state) {
  // idx: 0-based; state: 'active' | 'done' | 'failed'
  const el = steps[idx];
  el.classList.remove('active', 'done', 'failed');
  if (state) el.classList.add(state);
  if (state === 'done')   el.querySelector('.step-check').textContent = '✓';
  if (state === 'failed') el.querySelector('.step-check').textContent = '✗';
}

function activateStep(idx) {
  // mark previous done, current active
  for (let i = 0; i < idx; i++) setStep(i, 'done');
  setStep(idx, 'active');
}

function failStep(idx) {
  setStep(idx, 'failed');
}

/* ═══════════════════════════════════════════════════════════════
   UI STATE TRANSITIONS
═══════════════════════════════════════════════════════════════ */
function showScanning() {
  shieldIcon.className = 'shield-icon scanning';
  headline.textContent = 'Verifying Device';
  subline.textContent  = 'Collecting device signals — this takes just a second.';
  statusBar.className  = 'status-bar';
  retryBtn.classList.remove('visible');
  supportBtn.classList.remove('visible');
}

function showSuccess(deviceId) {
  shieldIcon.className = 'shield-icon ok';
  headline.textContent = 'Device Verified';
  subline.textContent  = 'Your device has been securely registered.';
  statusBar.textContent = '✓  Verification complete';
  statusBar.className   = 'status-bar ok';
  devidBox.textContent  = 'ID: ' + deviceId;
  devidBox.classList.add('visible');
  for (let i = 0; i < 4; i++) setStep(i, 'done');
}

function showError(msg, allowRetry = true, allowSupport = true) {
  shieldIcon.className = 'shield-icon fail';
  headline.textContent = 'Verification Failed';
  subline.textContent  = msg;
  statusBar.textContent = '✗  ' + msg;
  statusBar.className   = 'status-bar fail';
  if (allowRetry)   retryBtn.classList.add('visible');
  if (allowSupport) supportBtn.classList.add('visible');
}

function setStatus(msg) {
  statusBar.textContent = msg;
}

/* ═══════════════════════════════════════════════════════════════
   FINGERPRINT COLLECTION
═══════════════════════════════════════════════════════════════ */

// Canvas fingerprint — renders text with specific transforms and reads pixel data
function canvasFingerprint() {
  try {
    const c   = document.createElement('canvas');
    c.width   = 200;
    c.height  = 50;
    const ctx = c.getContext('2d');
    ctx.textBaseline = 'top';
    ctx.font         = '14px Arial';
    ctx.fillStyle    = '#f60';
    ctx.fillRect(0, 0, 200, 50);
    ctx.fillStyle = '#069';
    ctx.fillText('Device🔐Verify', 2, 15);
    ctx.fillStyle = 'rgba(102,204,0,0.7)';
    ctx.fillText('Device🔐Verify', 4, 17);
    return c.toDataURL().slice(-64); // tail-64 is stable enough
  } catch (_) { return 'canvas:unavailable'; }
}

// WebGL renderer fingerprint
function webglFingerprint() {
  try {
    const c   = document.createElement('canvas');
    const gl  = c.getContext('webgl') || c.getContext('experimental-webgl');
    if (!gl) return 'webgl:unavailable';
    const dbg = gl.getExtension('WEBGL_debug_renderer_info');
    const ren = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : 'n/a';
    const vnd = dbg ? gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL)   : 'n/a';
    return ren + '|' + vnd;
  } catch (_) { return 'webgl:error'; }
}

// Audio context fingerprint (frequency signature)
async function audioFingerprint() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 44100 });
    const osc = ctx.createOscillator();
    const ana = ctx.createAnalyser();
    const gn  = ctx.createGain();
    gn.gain.value = 0; // silent — we only read state
    osc.type = 'triangle';
    osc.connect(gn);
    gn.connect(ctx.destination);
    osc.connect(ana);
    osc.start(0);
    await new Promise(r => setTimeout(r, 120));
    const buf = new Float32Array(ana.frequencyBinCount);
    ana.getFloatFrequencyData(buf);
    osc.stop();
    ctx.close();
    // fold the array into a short signature
    const sum = buf.slice(0, 20).reduce((a, b) => a + (isFinite(b) ? b : 0), 0);
    return sum.toFixed(6);
  } catch (_) { return 'audio:unavailable'; }
}

// Font detection via canvas measurement
function fontFingerprint() {
  const base  = 'monospace';
  const fonts = ['Arial', 'Courier New', 'Georgia', 'Tahoma', 'Verdana',
                 'Times New Roman', 'Trebuchet MS', 'Comic Sans MS',
                 'Impact', 'Palatino'];
  const c     = document.createElement('canvas');
  const ctx   = c.getContext('2d');
  const base_w = (f) => { ctx.font = `16px ${f}`; return ctx.measureText('abcdefghijk').width; };
  const bw    = base_w(base);
  return fonts.filter(f => base_w(`'${f}',${base}`) !== bw).join(',') || 'none';
}

// Collect all signals
async function collectSignals() {
  const nav = window.navigator;
  const scr = window.screen;

  const [audioFp, canvasFp, webglFp, fontFp] = await Promise.all([
    audioFingerprint(),
    Promise.resolve(canvasFingerprint()),
    Promise.resolve(webglFingerprint()),
    Promise.resolve(fontFingerprint()),
  ]);

  return {
    // Hardware
    screen_res:     `${scr.width}x${scr.height}`,
    color_depth:    scr.colorDepth,
    pixel_ratio:    window.devicePixelRatio || 1,
    // Browser
    user_agent:     nav.userAgent,
    platform:       nav.platform,
    vendor:         nav.vendor || '',
    language:       nav.language,
    languages:      (nav.languages || []).join(','),
    cookie_enabled: nav.cookieEnabled,
    do_not_track:   nav.doNotTrack || 'unspecified',
    hardware_concurrency: nav.hardwareConcurrency || 0,
    max_touch_points:     nav.maxTouchPoints || 0,
    memory:         navigator.deviceMemory || 0,
    // Time
    timezone:       Intl.DateTimeFormat().resolvedOptions().timeZone,
    timezone_offset: new Date().getTimezoneOffset(),
    // Fingerprints
    canvas:         canvasFp,
    webgl:          webglFp,
    audio:          audioFp,
    fonts:          fontFp,
    // Storage availability
    local_storage:  !!window.localStorage,
    session_storage:!!window.sessionStorage,
    indexed_db:     !!window.indexedDB,
    // Connection
    connection_type: (navigator.connection || {}).effectiveType || 'unknown',
    // Touch / input
    touch_support:  ('ontouchstart' in window),
  };
}

/* ═══════════════════════════════════════════════════════════════
   HASHING — SHA-256 via SubtleCrypto
═══════════════════════════════════════════════════════════════ */
async function sha256(str) {
  const buf  = new TextEncoder().encode(str);
  const hash = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hash))
    .map(b => b.toString(16).padStart(2, '0'))
    .join('');
}

/* ═══════════════════════════════════════════════════════════════
   ANTI-BYPASS CHECKS
═══════════════════════════════════════════════════════════════ */
function detectSuspicious(signals) {
  const flags = [];

  // Headless browsers often miss these
  if (!signals.canvas || signals.canvas === 'canvas:unavailable')
    flags.push('canvas_blocked');

  if (!signals.webgl || signals.webgl === 'webgl:unavailable')
    flags.push('webgl_blocked');

  // Incognito: indexedDB / localStorage may work but storage quota is 0
  // We flag suspicious combos
  if (!signals.local_storage && !signals.session_storage)
    flags.push('storage_blocked');

  // Automation / bot UA patterns
  const botPatterns = /headless|phantom|selenium|puppeteer|playwright|webdriver/i;
  if (botPatterns.test(signals.user_agent))
    flags.push('bot_ua');

  // navigator.webdriver present in automated browsers
  if (navigator.webdriver)
    flags.push('webdriver');

  // Zero hardware concurrency is suspicious
  if (signals.hardware_concurrency === 0)
    flags.push('zero_cores');

  return flags;
}

/* ═══════════════════════════════════════════════════════════════
   MAIN FLOW
═══════════════════════════════════════════════════════════════ */
async function startVerification() {
  showScanning();

  // ── Step 1: collect signals ──────────────────────────────────
  activateStep(0);
  setStatus('Collecting device signals…');
  await sleep(400);

  let signals;
  try {
    signals = await collectSignals();
  } catch (e) {
    failStep(0);
    showError('Could not read device information. Try again.');
    return;
  }
  setStep(0, 'done');

  // ── Step 2: generate fingerprint ─────────────────────────────
  activateStep(1);
  setStatus('Generating secure fingerprint…');
  await sleep(300);

  // Build a stable, ordered string from all signals
  const ordered = [
    signals.screen_res,
    signals.color_depth,
    signals.pixel_ratio,
    signals.platform,
    signals.vendor,
    signals.language,
    signals.hardware_concurrency,
    signals.max_touch_points,
    signals.canvas,
    signals.webgl,
    signals.audio,
    signals.fonts,
    signals.timezone,
    signals.timezone_offset,
  ].join('||');

  let fingerprint;
  try {
    fingerprint = await sha256(ordered);
  } catch (e) {
    failStep(1);
    showError('Fingerprint generation failed. Try again.');
    return;
  }

  // Anti-bypass check
  const flags = detectSuspicious(signals);
  setStep(1, 'done');

  // ── Step 3: check device registry (send to bot) ──────────────
  activateStep(2);
  setStatus('Checking device registry…');
  await sleep(500);

  // Build payload
  const payload = {
    action:      'device_verify',
    fingerprint: fingerprint,
    flags:       flags,
    meta: {
      platform:   signals.platform,
      screen:     signals.screen_res,
      timezone:   signals.timezone,
      user_agent: signals.user_agent.slice(0, 100), // truncate
    }
  };

  setStep(2, 'done');

  // ── Step 4: send to bot backend ──────────────────────────────
  activateStep(3);
  setStatus('Sending verification…');
  await sleep(300);

  try {
    tg.sendData(JSON.stringify(payload));
  } catch (e) {
    failStep(3);
    showError('Could not send verification. Make sure you opened this from Telegram.');
    return;
  }

  setStep(3, 'done');
  showSuccess(fingerprint.slice(0, 16) + '…');
  setStatus('Verification sent — bot will respond shortly.');

  // Close after a beat
  setTimeout(() => tg.close(), 2200);
}

function openSupport() {
  tg.openTelegramLink('https://t.me/your_support_handle'); // replace in production
}

function sleep(ms) {
  return new Promise(r => setTimeout(r, ms));
}

/* ── AUTO-START ─────────────────────────────────────────────── */
window.addEventListener('DOMContentLoaded', () => {
  // Small delay so Telegram WebApp fully initialises
  setTimeout(startVerification, 600);
});
</script>
</body>
</html>
