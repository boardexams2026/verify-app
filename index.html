<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Device Verification</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .icon { font-size: 64px; margin-bottom: 20px; }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 10px; color: #4fc3f7; }
    p { font-size: 14px; color: #b0bec5; margin-bottom: 30px; line-height: 1.6; }
    .features {
      background: #16213e;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 30px;
      width: 100%;
      max-width: 320px;
    }
    .feature {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 8px 0;
      font-size: 14px;
      text-align: left;
    }
    .btn {
      background: linear-gradient(135deg, #4fc3f7, #1976d2);
      color: white;
      border: none;
      padding: 16px 40px;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      max-width: 320px;
      letter-spacing: 0.5px;
    }
    .btn:active { opacity: 0.85; transform: scale(0.98); }
  </style>
</head>
<body>
  <div class="icon">🔐</div>
  <h1>DEVICE VERIFICATION</h1>
  <p>Apna device verify karo aage badhne ke liye</p>

  <div class="features">
    <div class="feature"><span>⚡</span><span>Points milenge referral se</span></div>
    <div class="feature"><span>🛡️</span><span>Sirf ek account per device</span></div>
    <div class="feature"><span>🌐</span><span>Bot access unlock hoga</span></div>
  </div>

  <button class="btn" onclick="verify()">🔐 Verify My Device</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    function verify() {
      // initData bhejo back to bot
      tg.sendData(JSON.stringify({
        action: "device_verified",
        user_id: tg.initDataUnsafe?.user?.id,
        username: tg.initDataUnsafe?.user?.username || "",
        first_name: tg.initDataUnsafe?.user?.first_name || "",
        language_code: tg.initDataUnsafe?.user?.language_code || "",
        is_premium: tg.initDataUnsafe?.user?.is_premium || false,
      }));
    }
  </script>
</body>
</html>
